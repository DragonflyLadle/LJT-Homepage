name: Build check (temporary)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify key pages
        run: |
          test -f _site/index.html
          test -f _site/publications/index.html
          grep -c "SynLogic" _site/index.html
          grep -c "SynLogic" _site/publications/index.html
          grep -c "jliugi@connect.ust.hk" _site/index.html
          echo "All key pages verified."
