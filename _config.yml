title: "Junteng Liu"
name: "Junteng Liu"
description: "Academic homepage of Junteng Liu, first-year PhD candidate in the HKUST NLP Group, working on natural language processing, machine learning, reasoning, model truthfulness, and vision-language hallucination."
url: "https://dragonflyladle.github.io"
baseurl: "/LJT-Homepage"
repository: "DragonflyLadle/LJT-Homepage"
locale: "en-US"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

permalink: /:categories/:title/
encoding: "utf-8"

include:
  - _pages

exclude:
  - .github
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - markdown_generator
  - _posts
  - _talks
  - _teaching
  - _portfolio
  - _publications
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/portfolio.html
  - _pages/sitemap.md
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-paginate
  - jemoji

paginate: 5
paginate_path: /page:num/

sass:
  sass_dir: _sass
  style: compressed

author:
  name: "Junteng Liu"
  avatar: "https://github.com/Vicent0205.png?size=300"
  bio: "First-year PhD candidate at HKUST NLP Group researching natural language processing, machine learning, LLM reasoning, hallucination, truthfulness, and interpretability."
  employer: "HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  github: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      author_profile: true
